# Builds Kompass and runs the smoke test and the installer on Windows, macOS and Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-test.mjs
      - name: Installer runs
        shell: bash
        run: node install.mjs --dir "$RUNNER_TEMP/kompass-install" --no-shortcuts --no-start
